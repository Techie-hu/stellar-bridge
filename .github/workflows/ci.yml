name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  contracts:
    name: Soroban contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Cargo check (wasm32)
        run: cargo check --workspace --target wasm32-unknown-unknown
      - name: Cargo test
        run: cargo test --workspace
      - name: Cargo build (release wasm)
        run: cargo build --workspace --target wasm32-unknown-unknown --release
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm
          path: |
            contracts/**/target/wasm32-unknown-unknown/release/*.wasm

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --reporter=verbose
      - name: Build
        env:
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_NFT_CORE_ADDRESS: CZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ
          NEXT_PUBLIC_PAYMENT_TOKEN_ADDRESS: CZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ5
          NEXT_PUBLIC_MARKETPLACE_ADDRESS: CZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZM
        run: pnpm build
      - name: Upload .next artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-out
          path: apps/web/.next

  allgreen:
    name: Pipeline green
    needs: [contracts, frontend]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - run: echo "All jobs passed ✅"
