[package]
name = "payment-token"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Minimal SEP-41-compatible fungible token used as marketplace currency."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = true
lto = true
codegen-units = 1
